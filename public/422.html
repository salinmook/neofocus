<!DOCTYPE html>
<html>
<head>
  <title>NeoFocus - Something went wrong (422)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { 
      background-color: #f8fafc; 
      color: #1e293b; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
    }
    .card { 
      background: white; 
      padding: 50px; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
      text-align: center; 
      max-width: 450px; 
    }
    h1 { 
      font-size: 80px; 
      margin: 0; 
      color: #f59e0b; /* สีส้ม (Amber) สำหรับ Warning/Unprocessable */
      line-height: 1;
    }
    h2 {
      font-size: 24px;
      margin-top: 10px;
      color: #334155;
    }
    p { 
      font-size: 16px; 
      margin: 20px 0 30px 0; 
      color: #64748b;
      line-height: 1.6;
    }
    a { 
      background: #3b82f6; 
      color: white; 
      text-decoration: none; 
      padding: 14px 28px; 
      border-radius: 10px; 
      display: inline-block; 
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>422</h1>
    <h2>Change of plans?</h2>
    <p>Maybe it was a typo or something went sideways. The request couldn't be processed. Let's try again, shall we?</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
